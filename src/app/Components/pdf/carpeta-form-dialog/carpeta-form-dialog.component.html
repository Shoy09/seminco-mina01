<!-- carpeta-form-dialog.component.html -->
<h2 mat-dialog-title>Nueva Carpeta</h2>

<mat-dialog-content>
  <form [formGroup]="carpetaForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre de la carpeta</mat-label>
      <input 
        matInput 
        formControlName="nombre" 
        placeholder="Ej: Documentos 2026" 
      />
      <mat-error *ngIf="carpetaForm.get('nombre')?.hasError('required')">
        El nombre es requerido
      </mat-error>
      <mat-error *ngIf="carpetaForm.get('nombre')?.hasError('minlength')">
        Mínimo 3 caracteres
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button 
    mat-flat-button 
    color="primary" 
    (click)="crearCarpeta()"
    [disabled]="carpetaForm.invalid || loading">
    <i class="bi bi-folder-plus"></i>
    {{ loading ? 'Creando...' : 'Crear Carpeta' }}
  </button>
</mat-dialog-actions>
